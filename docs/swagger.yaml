definitions:
  admin.UserCreateForm:
    properties:
      email:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
      username:
        type: string
    required:
    - email
    - isAdmin
    - password
    - username
    type: object
  admin.UserUpdateForm:
    properties:
      isAdmin:
        type: boolean
      password:
        type: string
    type: object
  api.HandlerCreateForm:
    properties:
      dom:
        type: boolean
      domain:
        type: string
      path:
        type: string
      screenshot:
        type: boolean
    required:
    - dom
    - domain
    - path
    - screenshot
    type: object
  api.HandlerMemberCreateForm:
    properties:
      email:
        type: string
      role:
        $ref: '#/definitions/models.PermisionType'
    required:
    - email
    - role
    type: object
  api.HandlerMemberDeleteForm:
    properties:
      user_id:
        type: integer
    required:
    - user_id
    type: object
  api.HandlerMemberEditForm:
    properties:
      role:
        $ref: '#/definitions/models.PermisionType'
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  api.HandlerUpdateForm:
    properties:
      CollectedPages:
        items:
          type: string
        type: array
      Dom:
        type: boolean
      Screenshot:
        type: boolean
    required:
    - Dom
    - Screenshot
    type: object
  api.LoginForm:
    properties:
      email:
        type: string
      otp:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  api.SetPasswordForm:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  api.SetSecondFactorForm:
    properties:
      enable:
        type: boolean
      otp_code:
        type: string
      secret:
        type: string
    required:
    - enable
    - otp_code
    - secret
    type: object
  models.PermisionType:
    enum:
    - READ
    - WRITE
    - OWNER
    type: string
    x-enum-varnames:
    - READ
    - WRITE
    - OWNER
  types.NotifierInformation:
    properties:
      config:
        items:
          $ref: '#/definitions/types.NotifyConfig'
        type: array
      key:
        type: string
      name:
        type: string
    type: object
  types.NotifyConfig:
    properties:
      key:
        type: string
      sensitive:
        type: boolean
      text:
        type: string
      value:
        type: string
    type: object
